[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Off by default so `cargo xtask bundle …` doesn't pull in network / archive
# crates. Enable via the `xtask-fetch-ballroom` cargo alias (see
# .cargo/config.toml) when you actually need the dataset downloader.
fetch-ballroom = ["dep:anyhow", "dep:flate2", "dep:indicatif", "dep:reqwest", "dep:sha2", "dep:tar"]

[dependencies]
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95" }
anyhow = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
indicatif = { version = "0.18", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "rustls-native-certs"], optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
