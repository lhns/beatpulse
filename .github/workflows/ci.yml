name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-render0-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-render0-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: |
          choco install -y llvm cmake
        shell: pwsh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all

      # Ableton Link integration test — runs the full pipeline against a
      # separate AblLink listener via loopback discovery (no network
      # required). Linux-only because Windows runners' Defender "Public
      # network" rules can interfere with multicast in unattended runs.
      - name: Run link-integration test (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --features link-integration --test link_listener

  bundle-and-validate:
    name: bundle + validate (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-render0-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install -y llvm cmake
        shell: pwsh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Bundle
        run: cargo xtask bundle beatpulse --release

      - name: Install pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip -o pluginval.zip
          unzip pluginval.zip
          chmod +x pluginval

      - name: Install pluginval (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath .
        shell: pwsh

      - name: Run pluginval (VST3, Linux)
        if: runner.os == 'Linux'
        run: ./pluginval --strictness-level 5 --validate-in-process --validate target/bundled/beatpulse.vst3

      - name: Run pluginval (VST3, Windows)
        if: runner.os == 'Windows'
        run: ./pluginval.exe --strictness-level 5 --validate-in-process --validate target/bundled/beatpulse.vst3
        shell: bash

      # clap-validator is published only as a git crate (not on crates.io).
      - name: Install clap-validator
        run: cargo install --git https://github.com/free-audio/clap-validator.git --locked
        continue-on-error: true

      # Soft gate due to an upstream clap-validator bug (note_ports::get is
      # called with is_input=true when iterating outputs — bug in
      # src/plugin/ext/note_ports.rs:113 of clap-validator main). Our
      # plugin correctly returns false ("no input port") which the
      # validator misreports as "Plugin returned an error". The CLAP
      # spec-conformance is fine — verified by inspection of nih-plug's
      # CLAP wrapper. Flip to required after upstream fixes the bug.
      - name: Run clap-validator
        run: clap-validator validate target/bundled/beatpulse.clap
        continue-on-error: true
