[workspace]
members = [".", "xtask"]

[package]
name = "beatpulse"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Real-time beat detector VST3/CLAP with Ableton Link tempo broadcast"
repository = "https://github.com/lhns/beatpulse"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# nice-plug: maintained successor of nih-plug. See ADR-0029.
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.5.1"
# Must match nice-plug-egui's egui.
egui = "0.36"
aubio-rs = "0.2"
rusty_link = "0.4"
realfft = "3"
atomic_float = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_HiDpi"] }

[dev-dependencies]
approx = "0.5"
hound = "3"           # WAV decode for dataset harness
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UI snapshot testing. Feature-gated at the test-file level (not Cargo
# feature) because dev-dependencies cannot be marked optional in stable
# Cargo. Pays a one-time wgpu compile cost on `cargo test` builds.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
image = "0.25"
# Multi-format audio decode for the dataset harnesses (GiantSteps is
# MP3, Ballroom/SMC are WAV). Pure-Rust; isolated to test code via
# tests/common/audio.rs which is only used under #[cfg(feature =
# "dataset-tests")].
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }

[features]
default = []
# Run the Ballroom-dataset evaluation. Requires BEATPULSE_BALLROOM_DIR env var
# pointing at a local copy of the dataset (audio + .beats annotations).
dataset-tests = []
# Run the in-process Ableton Link listener integration test.
link-integration = []
# Run the CPU profile harness (cargo test --features cpu-bench --test cpu_profile).
cpu-bench = []

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1   # nih-plug DSP is unusable without some optimization
